<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Secure PDF Viewer</title>
  <!-- Load cached local scripts, which are downloaded by the mobile app -->
  <script src="./pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e293b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
    }

    #viewer-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 0;
      gap: 16px;
      box-sizing: border-box;
      width: 100vw;
    }

    .page-wrapper {
      position: relative;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
      background-color: #ffffff;
      max-width: 95%;
      display: inline-block;
    }

    canvas {
      display: block;
      max-width: 100%;
      height: auto !important;
    }

    /* CSS Watermark Overlay */
    .watermark-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(4, 1fr);
      opacity: 0.15;
      z-index: 10;
    }

    .watermark-text {
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 11px;
      color: #000000;
      font-weight: 700;
      transform: rotate(-30deg);
      white-space: nowrap;
      text-align: center;
      line-height: 1.4;
    }

    #loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0f172a;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 100;
      color: #ffffff;
    }

    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #3b82f6;
      animation: spin 1s linear infinite;
      margin-bottom: 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #status-text {
      font-size: 14px;
      font-weight: 500;
      color: #94a3b8;
    }

    /* Disable context menu & shortcuts */
    * {
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="loading-overlay">
    <div class="spinner"></div>
    <div id="status-text">Securing session...</div>
  </div>

  <div id="viewer-container"></div>

  <script>
    // Point worker to local script path
    pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

    // Helper to decode Base64 to ArrayBuffer
    function base64ToArrayBuffer(base64) {
      const binaryString = atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    // Helper to format date
    function formatDate(timestamp) {
      if (!timestamp) return new Date().toLocaleString();
      return new Date(timestamp).toLocaleString();
    }

    // Decrypt and load the PDF document
    async function loadSecurePDF(encryptedBase64, keyBase64, watermarkInfo) {
      const statusText = document.getElementById('status-text');
      try {
        statusText.innerText = 'Decrypting file in RAM...';

        // 1. Convert base64 data to buffers
        const keyBuffer = base64ToArrayBuffer(keyBase64);
        const combinedBuffer = base64ToArrayBuffer(encryptedBase64);

        // 2. Extract 12-byte IV (at the beginning of the file) and ciphertext
        const iv = combinedBuffer.slice(0, 12);
        const ciphertext = combinedBuffer.slice(12);

        // 3. Import Key for Web Crypto API
        const cryptoKey = await window.crypto.subtle.importKey(
          'raw',
          keyBuffer,
          { name: 'AES-GCM' },
          false,
          ['decrypt']
        );

        // 4. Decrypt in RAM
        const decryptedBuffer = await window.crypto.subtle.decrypt(
          {
            name: 'AES-GCM',
            iv: iv
          },
          cryptoKey,
          ciphertext
        );

        statusText.innerText = 'Rendering pages securely...';

        // 5. Load the decrypted file into PDF.js
        const pdf = await pdfjsLib.getDocument({ data: decryptedBuffer }).promise;
        const container = document.getElementById('viewer-container');
        container.innerHTML = '';

        // Generate watermark text string
        const watermarkString = `${watermarkInfo.userName}\nUID: ${watermarkInfo.userId}\nDevice: ${watermarkInfo.deviceId}\nDate: ${formatDate(watermarkInfo.timestamp)}`;

        // 6. Render all pages sequentially
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
          const page = await pdf.getPage(pageNum);
          
          // Create wrapper for overlays
          const wrapper = document.createElement('div');
          wrapper.className = 'page-wrapper';
          container.appendChild(wrapper);

          // Create canvas
          const canvas = document.createElement('canvas');
          const context = canvas.getContext('2d');
          wrapper.appendChild(canvas);

          // Get viewport scale (responsive)
          const viewportWidth = window.innerWidth * 0.95;
          const originalViewport = page.getViewport({ scale: 1.0 });
          const scale = viewportWidth / originalViewport.width;
          const viewport = page.getViewport({ scale: scale });

          canvas.height = viewport.height;
          canvas.width = viewport.width;

          // Render page to canvas
          await page.render({
            canvasContext: context,
            viewport: viewport
          }).promise;

          // Bake watermark directly onto the canvas before rendering overlay
          bakeWatermarkOnCanvas(canvas, context, watermarkString);

          // Add HTML/CSS watermark overlay on top
          createCSSWatermarkOverlay(wrapper, watermarkString);
        }

        // Hide loader
        document.getElementById('loading-overlay').style.display = 'none';

      } catch (err) {
        console.error(err);
        statusText.innerHTML = `<span style="color: #ef4444;">Decryption Error: ${err.message || 'Verification failed.'}</span>`;
      }
    }

    // Direct Canvas Watermark Drawing (Bakes it into the rendering)
    function bakeWatermarkOnCanvas(canvas, ctx, watermarkText) {
      ctx.save();
      ctx.globalAlpha = 0.08; // very subtle
      ctx.font = 'bold 12px sans-serif';
      ctx.fillStyle = '#000000';
      
      const lines = watermarkText.split('\n');
      const stepX = canvas.width / 2;
      const stepY = canvas.height / 3;

      for (let x = 30; x < canvas.width; x += stepX) {
        for (let y = 50; y < canvas.height; y += stepY) {
          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(-30 * Math.PI / 180);
          lines.forEach((line, index) => {
            ctx.fillText(line, 0, index * 15);
          });
          ctx.restore();
        }
      }
      ctx.restore();
    }

    // CSS/HTML Watermark overlay
    function createCSSWatermarkOverlay(wrapper, watermarkText) {
      const overlay = document.createElement('div');
      overlay.className = 'watermark-overlay';

      const lines = watermarkText.split('\n');
      const htmlContent = lines.map(line => `<div>${line}</div>`).join('');

      // Create grid of watermarks (12 text stamps per page)
      for (let i = 0; i < 12; i++) {
        const item = document.createElement('div');
        item.className = 'watermark-text';
        item.innerHTML = htmlContent;
        overlay.appendChild(item);
      }

      wrapper.appendChild(overlay);
    }

    // Listen for events from React Native WebView bridge
    window.addEventListener('message', (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === 'LOAD_PDF') {
          loadSecurePDF(message.encryptedData, message.key, message.watermark);
        }
      } catch (err) {
        console.error('Invalid message format received by webview:', err);
      }
    });

    // Notify React Native that webview is ready
    if (window.ReactNativeWebView) {
      window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'VIEWER_READY' }));
    }
  </script>
</body>
</html>
